name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Docker image builds
        run: docker build -t assistant-backend .

  android:
    name: Android build and unit tests
    # ubuntu-24.04 уже содержит Android SDK ($ANDROID_HOME), отдельная установка не нужна.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compile, unit tests, debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --console=plain --stacktrace assembleDebug testDebugUnitTest 2>&1 | tee build.log

      # Полные логи Actions бывают недоступны для чтения, поэтому ошибки дублируются в аннотации.
      - name: Report errors as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          keep = []
          for i, l in enumerate(lines):
              if l.startswith("> Task") and not l.endswith("FAILED"):
                  continue
              if re.match(r"^(e: |ERROR:|FAILURE:|\* What went wrong|Execution failed|.*FAILED$|.*AssertionError|.*Exception: |\S+ > .* FAILED)", l) \
                 or ("error:" in l.lower() and "warning" not in l.lower()):
                  keep.append(l[:400])
              if l.startswith("* What went wrong"):
                  keep.extend(x[:400] for x in lines[i+1:i+8])
          seen, out = set(), []
          for k in keep:
              if k not in seen:
                  seen.add(k); out.append(k)
          out = out[:200] or lines[-80:]
          chunk = 40
          for n in range(0, len(out), chunk):
              msg = "%0A".join(x.replace("%", "%25").replace("\r", "") for x in out[n:n+chunk])
              print(f"::error title=Gradle errors part {n//chunk+1}::{msg}")
          EOF

      - name: Unit test failures as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      text = (fail.get("message") or "") + "\n" + (fail.text or "")[:1500]
                      msg = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title=Test {tc.get('classname')}.{tc.get('name')}::{msg}")
          EOF

      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          rows, total, failed, skipped = [], 0, 0, 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              t, fl, sk = int(r.get("tests")), int(r.get("failures")) + int(r.get("errors")), int(r.get("skipped"))
              total += t; failed += fl; skipped += sk
              rows.append(f"{r.get('name').split('.')[-1]}: {t} tests, {fl} failed, {sk} skipped")
          print(f"::notice title=Unit tests: {total} run, {failed} failed, {skipped} skipped::" + "%0A".join(rows))
          EOF

      - name: Android Lint
        if: success()
        continue-on-error: true
        run: |
          ./gradlew --console=plain lintDebug
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, collections
          r = ET.parse("app/build/reports/lint-results-debug.xml").getroot()
          c = collections.Counter((i.get("severity"), i.get("id")) for i in r.iter("issue"))
          lines = [f"{sev} {iid}: {n}" for (sev, iid), n in c.most_common(40)]
          print(f"::notice title=Lint: {sum(c.values())} issues::" + "%0A".join(lines))
          EOF

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          if-no-files-found: ignore
          path: |
            android/build.log
            android/app/build/reports/
            android/app/build/test-results/

  emulator:
    name: E2E on emulator (no Google services)
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: voice-assistant-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run e2e (Android 14, AOSP image without Google)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/run_e2e.sh apk/app-debug.apk
      - name: Upload e2e screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          if-no-files-found: ignore
          path: ci-out/

  release:
    name: Publish APK to GitHub Releases
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voice-assistant-debug-apk
          path: apk
      - name: Recreate "latest-debug" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv apk/app-debug.apk apk/voice-assistant-debug.apk
          sha256sum apk/voice-assistant-debug.apk | tee apk/SHA256.txt
          gh release delete latest-debug --cleanup-tag -y || true
          gh release create latest-debug apk/voice-assistant-debug.apk apk/SHA256.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Debug APK (${GITHUB_SHA::7})" \
            --notes "Автосборка из коммита ${GITHUB_SHA}. Debug-подпись, для установки на свой телефон."
