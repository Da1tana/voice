name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Docker image builds
        run: docker build -t assistant-backend .

  android:
    name: Android build and unit tests
    # ubuntu-24.04 уже содержит Android SDK ($ANDROID_HOME), отдельная установка не нужна.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compile, unit tests, debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --console=plain --stacktrace assembleDebug testDebugUnitTest 2>&1 | tee build.log

      # Полные логи Actions бывают недоступны для чтения, поэтому ошибки дублируются в аннотации.
      - name: Report errors as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          keep = []
          for i, l in enumerate(lines):
              if re.match(r"^(e: |w: .*error|ERROR:|FAILURE:|\* What went wrong|> |Execution failed|.*FAILED$|.*AssertionError|.*Exception: )", l) \
                 or "error:" in l.lower() and "warning" not in l.lower():
                  keep.append(l[:400])
              if l.startswith("* What went wrong"):
                  keep.extend(x[:400] for x in lines[i+1:i+8])
          seen, out = set(), []
          for k in keep:
              if k not in seen:
                  seen.add(k); out.append(k)
          out = out[:200] or lines[-80:]
          chunk = 40
          for n in range(0, len(out), chunk):
              msg = "%0A".join(x.replace("%", "%25").replace("\r", "") for x in out[n:n+chunk])
              print(f"::error title=Gradle errors part {n//chunk+1}::{msg}")
          EOF

      - name: Unit test failures as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      text = (fail.get("message") or "") + "\n" + (fail.text or "")[:1500]
                      msg = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title=Test {tc.get('classname')}.{tc.get('name')}::{msg}")
          EOF

      - name: Android Lint
        if: success()
        continue-on-error: true
        run: ./gradlew --console=plain lintDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          if-no-files-found: ignore
          path: |
            android/build.log
            android/app/build/reports/
            android/app/build/test-results/
