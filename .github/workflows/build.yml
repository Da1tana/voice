name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Docker image builds
        run: docker build -t assistant-backend .

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile, unit tests, debug APK
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest
      - name: Android Lint
        if: success()
        continue-on-error: true
        run: ./gradlew lintDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/wakeword/build/reports/
